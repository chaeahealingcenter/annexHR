<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | 아넥스HR교육원</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#22314B">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{color-scheme:light;--navy:#22314B;--ink:#2A303B;--muted:#616B79;--line:#E2E5EA;--teal:#2F6E71}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:#fff;color:var(--ink);font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
.hdr{background:var(--navy);color:#fff}
.wrap{width:100%;max-width:760px;margin-inline:auto;padding-inline:20px}
.hdr .wrap{display:flex;align-items:center;height:64px}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none}
.logo__mk{width:26px;height:26px;border-radius:7px;background:#fff;color:var(--navy);display:grid;place-items:center;font-size:13px;font-weight:600}
.logo__tx{font-size:17px;font-weight:600;letter-spacing:-.03em}
main{flex:1;display:grid;place-items:center;padding-block:64px}
.code{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--teal)}
h1{font-size:clamp(24px,3.4vw,32px);font-weight:600;letter-spacing:-.03em;line-height:1.35;margin:8px 0 12px;text-wrap:balance}
p{margin:0 0 24px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;padding:8px 12px;border-radius:10px;font-size:16px;font-weight:600;text-decoration:none;border:1px solid var(--navy);transition:transform .3s cubic-bezier(.22,1,.36,1),background .3s cubic-bezier(.22,1,.36,1)}
.btn--navy{background:var(--navy);color:#fff}
.btn--line{background:#fff;color:var(--navy)}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.ftr{border-top:1px solid var(--line);padding-block:20px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="hdr"><div class="wrap"><a class="logo" href="/"><span class="logo__mk">A</span><span class="logo__tx">아넥스HR교육원</span></a></div></header>
<main><div class="wrap">
  <div class="code">404</div>
  <h1>찾으시는 페이지가 없습니다</h1>
  <p>주소가 바뀌었거나 잘못 입력된 것 같습니다. 프로그램 안내와 교육 문의는 첫 페이지에서 바로 보실 수 있습니다.</p>
  <div class="btns">
    <a class="btn btn--navy" href="/">첫 페이지로 가기</a>
    <a class="btn btn--line" href="/#inquiry">교육 문의하기</a>
  </div>
</div></main>
<footer class="ftr"><div class="wrap">원주채아힐링센터 · 0507-1431-7305 · annexhredu@gmail.com</div></footer>
</body>
</html>
